# NIDO Supabase CLI Configuration (Phase 1 Foundation)
# Shared across nido-dev and nido-prod; link only nido-dev during local development.

project_id = "nido-dev"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://127.0.0.1:8080"
additional_redirect_urls = ["http://localhost:8080", "http://localhost:5173"]
jwt_expiry = 3600
enable_signup = false

[functions.bootstrap-system-owner]
verify_jwt = false

[functions.resend-system-owner-invitation]
verify_jwt = false
